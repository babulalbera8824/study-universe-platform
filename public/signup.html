<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Study Universe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--white) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .signup-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            animation: fadeInUp 0.6s ease-out;
        }
        
        .signup-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .signup-header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        
        .signup-header p {
            color: var(--secondary-color);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-color);
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }
        
        .password-requirements {
            font-size: 0.75rem;
            color: var(--secondary-color);
            margin-top: 5px;
        }
        
        .requirements-list {
            list-style: none;
            margin-top: 8px;
        }
        
        .requirements-list li {
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .requirements-list li .icon {
            color: var(--danger-color);
            font-size: 0.6rem;
        }
        
        .requirements-list li.valid .icon {
            color: var(--success-color);
        }
        
        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        
        .terms-checkbox input {
            margin-top: 4px;
            cursor: pointer;
        }
        
        .terms-checkbox a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .terms-checkbox a:hover {
            text-decoration: underline;
        }
        
        .signup-btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
        }
        
        .login-link {
            text-align: center;
            color: var(--secondary-color);
        }
        
        .login-link a {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <h1>Join Us</h1>
            <p>Create your Study Universe account</p>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required placeholder="Your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" onkeyup="checkPasswordStrength()">
                <div class="password-requirements">
                    <ul class="requirements-list">
                        <li id="req-length">
                            <span class="icon">●</span>
                            At least 8 characters
                        </li>
                        <li id="req-uppercase">
                            <span class="icon">●</span>
                            One uppercase letter
                        </li>
                        <li id="req-number">
                            <span class="icon">●</span>
                            One number
                        </li>
                        <li id="req-special">
                            <span class="icon">●</span>
                            One special character
                        </li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="••••••••">
            </div>

            <label class="terms-checkbox">
                <input type="checkbox" name="terms" required>
                <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
            </label>

            <button type="submit" class="btn btn-primary signup-btn">Create Account</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            
            // Check length
            const lengthCheck = password.length >= 8;
            updateRequirement('req-length', lengthCheck);
            
            // Check uppercase
            const uppercaseCheck = /[A-Z]/.test(password);
            updateRequirement('req-uppercase', uppercaseCheck);
            
            // Check number
            const numberCheck = /[0-9]/.test(password);
            updateRequirement('req-number', numberCheck);
            
            // Check special character
            const specialCheck = /[!@#$%^&*]/.test(password);
            updateRequirement('req-special', specialCheck);
        }
        
        function updateRequirement(id, valid) {
            const element = document.getElementById(id);
            if (valid) {
                element.classList.add('valid');
            } else {
                element.classList.remove('valid');
            }
        }
        
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            // Simulate signup (replace with actual API call)
            alert('Signup feature coming soon!');
        });
    </script>
</body>
</html>
